server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión: entrega los .gz que Vite generó en el build y comprime al vuelo lo demás
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
